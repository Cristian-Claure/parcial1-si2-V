services:
  postgres:
    image: postgres:17-alpine
    container_name: velora-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${VELORA_DB_NAME}
      POSTGRES_USER: ${VELORA_DB_USER}
      POSTGRES_PASSWORD: ${VELORA_DB_PASSWORD}

    ports:
      - "${VELORA_DB_PORT}:5432"

    volumes:
      - velora_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VELORA_DB_USER} -d ${VELORA_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  velora_postgres_data:
    name: velora_postgres_data